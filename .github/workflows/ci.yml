name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & smoke test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate manifest
        run: python3 tests/check_manifest.py go

      - name: Build (go)
        run: |
          go vet ./...
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/tml_ext ./src

      - name: Protocol smoke test
        run: python3 tests/smoke.py ./bin/tml_ext

      - name: Package .tmlext
        run: python3 build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tml-extension-go
          path: template-tml-extension-go.tmlext
          if-no-files-found: error
